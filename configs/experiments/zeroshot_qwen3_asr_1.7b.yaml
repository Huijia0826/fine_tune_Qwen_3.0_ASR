# Qwen3-ASR-1.7B zero-shot (2026-11-09), qwen-asr transformers backend in .venv-qwen (src/whisperflow/eval/qwen_asr_backend.py).
# Greedy decoding (package default); whole clip in one pass (≤ 1200 s); language auto-detected and logged.
model:
  name_or_path: Qwen/Qwen3-ASR-1.7B
  revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  adapter_path: null
decoding:
  language: auto           # Qwen language name (e.g. Chinese) to force; auto = model decides
  context: ""              # system-prompt context (contextual biasing); none for the baseline
  max_new_tokens: 1024     # as in the Qwen3-ASR model-card evaluation
  output_script: simplified
runtime:
  backend: qwen3_asr
  dtype: bfloat16
  batch_size: 16
  seed: 1234
data:
  data_root: data/private
  manifest: data/manifests/benchmark_v1.jsonl
  split: val
scoring:
  normalization_policy: zh_en_v1
  bootstrap_iters: 1000
  min_slice_n: 30
