# benchmark v2.0 (owner, 2026-11-12): qwen3asr_J3 checkpoint-600 with the J3 evaluation decoding
# (configs/experiments/qwen3asr_ctxJ2_chunk25.yaml: greedy, 25 s chunks + short-tail merge, simplified output) and the
# production context of each clip (J2 form; runs/qwen_sft_J3_contexts.jsonl = the J2 file for these 911 clips).
# batch_size 1 so each clip's decode time is its own (raw_latency in the arena-style export). Scored with
# scripts/bv2_0_eval.py export + scripts/score_arena_export.py against the arena ground_truth.
model:
  name_or_path: Qwen/Qwen3-ASR-1.7B
  revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  adapter_path: null
  checkpoint_path: runs/qwen3asr_J3/checkpoint-600
decoding:
  language: auto
  context: ""
  context_file: runs/qwen_sft_J3_contexts.jsonl
  max_new_tokens: 1024
  max_chunk_sec: 25
  output_script: simplified
runtime:
  backend: qwen3_asr
  dtype: bfloat16
  batch_size: 1
  seed: 1234
data:
  data_root: data/private
  manifest: data/manifests/benchmark_v2_0.jsonl
  split: test
scoring:
  normalization_policy: zh_en_v1
  bootstrap_iters: 1000
  min_slice_n: 30
