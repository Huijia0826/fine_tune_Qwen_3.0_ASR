# Qwen3-ASR-1.7B, 25 s chunks, per-clip production context (run J1, 2026-11-09). checkpoint_path set by the run script.
# Greedy decoding; long clips cut at a low-energy point near 25 s (every chunk < 30 s); language auto-detected.
model:
  name_or_path: Qwen/Qwen3-ASR-1.7B
  revision: 7278e1e70fe206f11671096ffdd38061171dd6e5
  adapter_path: null
  checkpoint_path: null    # fine-tuned checkpoint dir (overrides the pinned snapshot)
decoding:
  language: auto           # Qwen language name (e.g. Chinese) to force; auto = model decides
  context: ""              # default for clips missing from context_file
  context_file: runs/qwen_sft/J1/contexts.jsonl   # per-clip context (scripts/make_qwen_e2e_data.py)
  max_new_tokens: 1024     # as in the Qwen3-ASR model-card evaluation
  max_chunk_sec: 25        # 2026-11-09: one-pass decoding drifted on > 30 s clips
  output_script: simplified
runtime:
  backend: qwen3_asr
  dtype: bfloat16
  batch_size: 16
  seed: 1234
data:
  data_root: data/private
  manifest: data/manifests/benchmark_v1.jsonl
  split: val
scoring:
  normalization_policy: zh_en_v1
  bootstrap_iters: 1000
  min_slice_n: 30
