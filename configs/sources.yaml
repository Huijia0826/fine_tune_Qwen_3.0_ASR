# Source / license / consent registry.
#
# Every manifest record's `source_id` and `license_or_consent_id` must resolve here, and
# the source must be `approved` for the split the record is in. This is how
# "all manifest records traceable" (plan.md Phase 1 acceptance) is enforced in code.
#
# status: approved | pending_review | rejected
# allowed_splits: which splits records from this source may land in.
#
# No real corpus is approved yet: each one needs owner sign-off on its license against
# the intended use (private demo vs public release). See docs/data_sources.md.

sources:
  synthetic_test:
    description: Synthetic fixtures generated inside unit tests. Never used for real metrics.
    url: null
    license: n/a (generated)
    commercial_use: n/a
    redistribution: n/a
    status: approved
    allowed_splits: [train, val, test, unassigned]
    license_or_consent_ids: [synthetic]

  # Example of a real entry, intentionally left pending until the owner approves it:
  # aishell1:
  #   description: AISHELL-1 Mandarin read speech (OpenSLR 33)
  #   url: https://www.openslr.org/33/
  #   license: Apache-2.0
  #   status: pending_review
  #   allowed_splits: [train, val]
  #   license_or_consent_ids: [aishell1_apache2]

  benchmark_v1:
    description: >
      VoiceCursor internal regression benchmark v1.0 (425 real user dictation clips, arena
      batch 01a17cb6-81e2-775c-9edd-40d39a501ce2). Owner-approved for private evaluation only.
      NEVER used for training or checkpoint selection.
    url: arena (Supabase) + s3://voicecursor-production
    license: internal / private (owner approval 2026-10-27)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [test, unassigned]
    license_or_consent_ids: [voicecursor_internal_benchmark]

  ascend:
    description: >
      ASCEND (CAiRE/ASCEND) Hong Kong zh-en code-switch conversational speech. Full dataset
      downloaded 2026-10-29 from huggingface.co @737e980, sha256 in data/private/ascend/raw/SHA256SUMS.
      Owner approved for training 2026-10-29. Official splits are speaker-disjoint (train 18 / val 3 /
      test 2 speakers, checked), so no re-split is needed.
    url: https://huggingface.co/datasets/CAiRE/ASCEND
    license: CC BY-SA 4.0
    commercial_use: yes (ShareAlike)
    redistribution: yes (ShareAlike)
    status: approved
    allowed_splits: [train, val, test, unassigned]
    license_or_consent_ids: [ascend_cc_by_sa_4]

  benchmark_chinese:
    description: >
      VoiceCursor production dictation recordings (~/Desktop/build_benchmark/benchmark_chinese,
      testset_zh_500 v3, 408 clips with audio + ground truth). Owner states they are authorized to use
      it for training (2026-10-29). The 5 recordings that are also in benchmark v1 are excluded.
      screen_text / audio_context are not copied. Owner approved upload to AutoDL GPUs for training on 2026-10-30 (delete cloud copies afterwards).
    url: s3://voicecursor-production (internal)
    license: internal / private (owner approval 2026-10-29)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, val, unassigned]
    license_or_consent_ids: [voicecursor_internal_training]

  arena_019f8e51:
    description: >
      ASR Arena dataset "Refined V3 English E2E dataset" (arena dataset 019f8e51-c658-75d0-9ada-5fc3f020e722,
      885 English dictation clips, arena uploads in s3://voicecursor-production). Owner approved for TRAINING
      on 2026-10-30. Ground truth is the refined E2E target (fillers removed, some self-corrections / formatting
      applied), mixed provenance: human-edited, reviewed, and 3-model auto-passed without human review (per-file
      list in data/private/arena_019f8e51/gt_provenance.csv). No user ids available (one pseudo-speaker per file).
      The 2 clips whose transcripts nearly match benchmark v1 test items are excluded.
      Owner approved upload to AutoDL GPUs for training on 2026-10-30 (delete cloud copies afterwards).
    url: arena (Supabase) + s3://voicecursor-production (internal)
    license: internal / private (owner approval 2026-10-30)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, val, unassigned]
    license_or_consent_ids: [voicecursor_internal_training_arena_019f8e51]

  arena_019f6442:
    description: >
      ASR Arena dataset "E2E Intent ZH Pure (v7)" (arena dataset 019f6442-7412-7eac-a499-d007d1cd06b9,
      105 pure-Chinese real-user dictation clips from s3://voicecursor-production / voicecursor-test,
      2026-05~06). Owner approved for TRAINING on 2026-10-30. Ground truth is the E2E intent text
      (GPT-5.5 + frozen prompt v9 from 4-model-consensus verbal GT, not verbatim); 35 labels human-edited in
      arena, the rest never reviewed (per-file list in data/private/arena_019f6442/gt_provenance.csv).
      Real user ids (pseudonymised "u"+sha256[:12], 29 speakers). The arena set itself was used for
      evaluation runs. No audio / transcript overlap with benchmark v1, benchmark_chinese, arena_019f8e51
      or ASCEND (scripts/arena_dataset_to_ingest.py); 7 speakers also appear in benchmark v1 test.
      Owner approved upload to AutoDL GPUs for training on 2026-10-30 (delete cloud copies afterwards).
    url: arena (Supabase) + s3://voicecursor-production (internal)
    license: internal / private (owner approval 2026-10-30)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, val, unassigned]
    license_or_consent_ids: [voicecursor_internal_training_arena_019f6442]

  val_longform:
    description: >
      Synthetic long-form VALIDATION set (scripts/build_val_longform.py): consecutive val clips of one
      speaker from ascend / benchmark_chinese joined into 35-60 s with 0.3 s gaps. Used only to check long-form
      decoding and to select checkpoints. Never for training or test. Inherits the parents' licenses.
    url: derived
    license: inherits ASCEND CC BY-SA 4.0 / internal
    commercial_use: inherits
    redistribution: no
    status: approved
    allowed_splits: [val, unassigned]
    license_or_consent_ids: [ascend_cc_by_sa_4, voicecursor_internal_training]

  online_phase1:
    description: >
      VoiceCursor production zh dictation, phase 1 of docs/data_collection_plan.md (scans 2026-08-31 → 11-01,
      test recordings and tester accounts excluded, high-quality audio only). Drafts by local whisper-large-v3,
      every label reviewed by the owner on 2026-11-01 (verdict ok / fix; drops excluded). Owner decision
      2026-11-02: the 230 clips first meant for the locked test set are used for TRAINING, the 57 val clips join
      users' val. Speakers pseudonymised "u"+sha256(user)[:12] like benchmark_chinese / benchmark v1. Owner
      approved production audio for training and AutoDL upload (2026-10-31).
    url: s3://voicecursor-production (internal)
    license: internal / private (owner approval 2026-10-31)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, val, unassigned]
    license_or_consent_ids: [voicecursor_internal_training]
  recording_freeform_test:
    description: >
      Owner's free dictation on the VoiceCursor TEST environment, 2026-11-03 (not a script; s3://voicecursor-test),
      labelled from scratch by the owner (pre-filled with the production ASR text, D step 600 draft alongside;
      fragments and private-person clips dropped). TEST ONLY (owner, 2026-11-04): measures term recognition on the
      owner's voice in sentences that were never trained on; same speaker as recording_v1 (train).
    url: s3://voicecursor-test (internal)
    license: internal / owner's own recordings (owner, 2026-11-04)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [test, unassigned]
    license_or_consent_ids: [voicecursor_owner_recording]
  recording_v2:
    description: >
      Recording script v2 (2026-11-05; scripts/build_recording_script_v2.py, 168 ready-to-read sentences: spelling,
      self-correction, Chinese / English entities, general), dictated mostly by the owner on the owner's PRODUCTION
      account (s3://voicecursor-production), MacBook. Owner-reviewed; 12 spelling labels written by the assistant to the
      2026-11-04 policy at the owner's request (reviewer_id owner+assistant_expected). TRAIN part only (script split).
    url: s3://voicecursor-production (internal)
    license: internal / owner's own recordings (owner, 2026-11-05)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, unassigned]
    license_or_consent_ids: [voicecursor_owner_recording]
  recording_v2_test:
    description: >
      TEST part of recording script v2 (script split; never trained): same speaker as recording_v1 / v2 train, different
      sentences, plus terms that occur only here (Replit, Lovable, 瑞幸, 春熙路, …). Only owner-verified labels.
    url: s3://voicecursor-production (internal)
    license: internal / owner's own recordings (owner, 2026-11-05)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [test, unassigned]
    license_or_consent_ids: [voicecursor_owner_recording]
  recording_v1:
    description: >
      Owner-dictated recording script v1 (2026-11-04; scripts/build_recording_script.py): 132 sentences aimed at the
      terms our models get wrong (mined from human-verified training data only, never test / val) plus high-frequency
      English words of Chinese dictation and self-correction / spelling. Recorded with VoiceCursor on the TEST
      environment (s3://voicecursor-test), MacBook Pro microphone, one speaker. Pre-filled with the script, every label
      reviewed by the owner to what was actually said (verdict ok / fix; fragments dropped). Train only.
    url: s3://voicecursor-test (internal)
    license: internal / owner's own recordings (owner, 2026-11-04)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, unassigned]
    license_or_consent_ids: [voicecursor_owner_recording]
  online_pool:
    description: >
      VoiceCursor production dictation, the phase 1 TRAINING POOL (scripts/dump_online_pool.py; same scans and
      exclusions as online_phase1). Pre-filled with the production ASR text, our model's draft shown alongside;
      every label reviewed by the owner (verdict ok / fix; drops excluded). Batch 1 part 1 (2026-11-03): 267 clips
      of the CS high-quality group. Train only. Speakers pseudonymised "u"+sha256(user)[:12] as online_phase1, so
      users shared with users' val can be reported as seen.
    url: s3://voicecursor-production (internal)
    license: internal / private (owner approval 2026-10-31)
    commercial_use: internal only
    redistribution: no
    status: approved
    allowed_splits: [train, unassigned]
    license_or_consent_ids: [voicecursor_internal_training]
