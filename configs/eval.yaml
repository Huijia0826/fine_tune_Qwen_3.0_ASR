# Baseline evaluation config. Changing ANY field here creates a different experiment;
# the full config + its hash is stored with every run.
model:
  name_or_path: openai/whisper-small     # multilingual, 241.7M params
  revision: 973afd24965f72e36ca33b3055d56a652f456b4d   # weights sha256 1d773488...596b verified
  adapter_path: null                     # LoRA adapter dir (Phase 2)

decoding:
  language: auto     # owner decision 2026-10-27: benchmark is en / zh / zh-en mixed
  task: transcribe
  num_beams: 5       # deterministic beam search; no sampling, no temperature fallback
  max_new_tokens: 200          # short (<=30 s) clips only
  long_form:                   # clips > 30 s: sequential long-form decoding
    condition_on_prev_tokens: false   # avoid hallucinations propagating across windows
  return_timestamps: false
  initial_prompt: null   # baseline is unprompted; prompting is a Phase 3 ablation

runtime:
  device: auto       # auto = mps > cuda > cpu
  dtype: float32     # fp32 for the reference baseline; fp16 is a separate runtime experiment
  batch_size: 8
  seed: 1234

data:
  data_root: data/private
  manifest: data/manifests/benchmark_v1.jsonl
  split: val         # test requires --allow-test and is logged to reports/test_access_log.jsonl

scoring:
  normalization_policy: zh_en_v1
  bootstrap_iters: 1000
  min_slice_n: 30
