[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-asr-ft"
version = "0.1.0"
description = "Fine-tune and evaluate Qwen3-ASR on your own speech data (contextual biasing, MER scoring, checkpoint selection)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "soundfile"]

[project.optional-dependencies]
# GPU side: qwen-asr pins its own transformers / torch versions, so install it in a dedicated environment.
train = ["qwen-asr==0.0.6", "datasets", "librosa", "huggingface_hub"]
zh = ["opencc-python-reimplemented"]   # Traditional -> Simplified Chinese in scoring and output
dev = ["pytest"]

[project.scripts]
qasr = "qwen_asr_ft.cli:main"

[tool.setuptools]
packages = ["qwen_asr_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
