[project]
name = "whisperflow"
version = "0.1.0"
description = "Mandarin / Mandarin-English code-switch dictation: data pipeline, Whisper LoRA fine-tuning, evaluation"
requires-python = ">=3.12,<3.13"
# Core = data pipeline + scoring. Must stay lightweight (no torch) so manifests can be
# validated/audited on any machine.
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jiwer>=3.0",
    "opencc>=1.1.9",
    "text2num>=3.1.0",
]

[project.optional-dependencies]
# Baseline inference + (later) LoRA training. Installed only after owner approval.
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "peft>=0.13",
    "datasets>=3.0",
    "librosa>=0.10",
]
# Phase 4 – not installed yet.
serve = [
    "faster-whisper>=1.0",
    "ctranslate2>=4.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
wf-ingest = "whisperflow.data.ingest:main"
wf-validate = "whisperflow.data.validate:main"
wf-dedup = "whisperflow.data.dedup:main"
wf-split = "whisperflow.data.split:main"
wf-audit = "whisperflow.data.audit:main"
wf-transcribe = "whisperflow.eval.transcribe:main"
wf-score = "whisperflow.eval.score:main"
wf-analyze = "whisperflow.eval.error_analysis:main"
wf-cleaning = "whisperflow.eval.cleaning:main"
wf-train = "whisperflow.training.train:main"
wf-latency = "whisperflow.eval.latency:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisperflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 115
# vendored verbatim, pinned by sha256 in eval/official.py — never reformat
extend-exclude = ["src/whisperflow/eval/vendor"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
